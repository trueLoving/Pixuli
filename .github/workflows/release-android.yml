name: Release Android

# 仅 GitHub Actions 手动触发（workflow_dispatch）

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer without prefix (e.g. 2.0.0). Empty = app/package.json'
        required: false
        default: ''
      is-publish:
        description: 'Create/upload GitHub Release (release builds only)'
        required: false
        default: true
        type: boolean
      build-type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./app/package.json').version")
          VERSION="${{ github.event.inputs.version }}"
          if [[ -z "$VERSION" ]]; then VERSION="$PKG_VERSION"; fi
          TAG="v${VERSION}-android"
          BUILD_TYPE="${{ github.event.inputs.build-type }}"
          IS_PUBLISH="${{ github.event.inputs.is-publish }}"
          {
            echo "VERSION=$VERSION"
            echo "TAG=$TAG"
            echo "BUILD_TYPE=$BUILD_TYPE"
            echo "IS_PUBLISH=$IS_PUBLISH"
          } >> "$GITHUB_OUTPUT"

      - name: Bump versions
        run: |
          cd app
          TARGET="${{ steps.version.outputs.VERSION }}"
          CURRENT=$(node -p "require('./package.json').version")
          if [[ "$CURRENT" != "$TARGET" ]]; then
            pnpm version "$TARGET" --no-git-tag-version
          fi
          sed -i "s/versionName \".*\"/versionName \"$TARGET\"/" android/app/build.gradle

      - name: Configure release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > app/android/keystore.properties

      - name: Fallback debug keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkey -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - run: pnpm install --frozen-lockfile

      - name: Build APK
        run: |
          if [[ "${{ steps.version.outputs.BUILD_TYPE }}" == "debug" ]]; then
            pnpm run build:android:debug
          else
            pnpm run build:android
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pixuli-android-${{ steps.version.outputs.BUILD_TYPE }}-v${{ steps.version.outputs.VERSION }}
          path: |
            app/android/app/build/outputs/apk/release/app-release.apk
            app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release
        if: ${{ steps.version.outputs.IS_PUBLISH == 'true' && steps.version.outputs.BUILD_TYPE == 'release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          VER="${{ steps.version.outputs.VERSION }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists"
          else
            gh release create "$TAG" \
              --title "Pixuli Android v${VER}" \
              --notes "## Pixuli Android v${VER}

          Capacitor APK from \`${GITHUB_SHA}\`. See CHANGELOG and docs/02-system-design/05-release-versioning.md."
          fi
          gh release upload "$TAG" \
            app/android/app/build/outputs/apk/release/app-release.apk \
            --clobber
