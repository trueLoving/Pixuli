name: Release Android

# 仅 GitHub Actions 手动触发（workflow_dispatch）

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer without prefix (e.g. 2.0.0). Empty = app/package.json'
        required: false
        default: ''
      is-publish:
        description: 'Create/upload GitHub Release (release builds only)'
        required: false
        default: true
        type: boolean
      build-type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - release
          - debug
        default: release
  workflow_call:
    inputs:
      version:
        description: 'SemVer without prefix. Empty = app/package.json'
        required: false
        type: string
        default: ''
      build-type:
        description: 'release or debug'
        required: true
        type: string
      is-publish:
        description: 'Create/upload GitHub Release (release builds only)'
        required: false
        type: boolean
        default: true

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./app/package.json').version")
          VERSION="${{ inputs.version }}"
          if [[ -z "$VERSION" ]]; then VERSION="$PKG_VERSION"; fi
          TAG="v${VERSION}-android"
          BUILD_TYPE="${{ inputs.build-type }}"
          IS_PUBLISH="${{ inputs.is-publish }}"
          {
            echo "VERSION=$VERSION"
            echo "TAG=$TAG"
            echo "BUILD_TYPE=$BUILD_TYPE"
            echo "IS_PUBLISH=$IS_PUBLISH"
          } >> "$GITHUB_OUTPUT"

      - name: Bump versions
        run: |
          cd app
          TARGET="${{ steps.version.outputs.VERSION }}"
          CURRENT=$(node -p "require('./package.json').version")
          if [[ "$CURRENT" != "$TARGET" ]]; then
            pnpm version "$TARGET" --no-git-tag-version
          fi
          sed -i "s/versionName \".*\"/versionName \"$TARGET\"/" android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          KS="app/android/release.keystore"
          if [[ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]]; then
            echo "ANDROID_KEYSTORE_PASSWORD is empty."
            exit 1
          fi
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KS"; then
            echo "ANDROID_KEYSTORE_BASE64 is not valid base64. Encode the keystore file once, with no extra quotes."
            exit 1
          fi
          if ! keytool -list -keystore "$KS" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /tmp/keystore-list.txt; then
            echo "Cannot open release.keystore. The store password does not match, or the base64 secret is not that keystore."
            exit 1
          fi
          mapfile -t ALIASES < <(sed -n 's/,.*PrivateKeyEntry.*//p' /tmp/keystore-list.txt)
          rm -f /tmp/keystore-list.txt
          ALIAS="${ANDROID_KEY_ALIAS:-}"
          if [[ -z "$ALIAS" ]]; then
            if [[ ${#ALIASES[@]} -eq 1 ]]; then
              ALIAS="${ALIASES[0]}"
              echo "ANDROID_KEY_ALIAS is empty; using the only key alias."
            else
              echo "ANDROID_KEY_ALIAS is empty. Set it to one of: ${ALIASES[*]:-none}"
              exit 1
            fi
          fi
          KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          if ! keytool -importkeystore \
            -srckeystore "$KS" -destkeystore /tmp/pixuli-key-check.p12 \
            -srcstorepass "$ANDROID_KEYSTORE_PASSWORD" -deststorepass "$ANDROID_KEYSTORE_PASSWORD" \
            -srcalias "$ALIAS" -srckeypass "$KEY_PASS" -noprompt >/dev/null; then
            echo "Cannot read alias '$ALIAS'. Check ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
            echo "Aliases in this keystore: ${ALIASES[*]:-none}"
            exit 1
          fi
          rm -f /tmp/pixuli-key-check.p12
          python3 - "$ALIAS" "$KEY_PASS" <<'PY'
          import os
          import sys
          from pathlib import Path

          alias, key_pass = sys.argv[1], sys.argv[2]

          def esc(value: str) -> str:
              return value.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r")

          lines = [
              "storeFile=../release.keystore",
              "storePassword=" + esc(os.environ["ANDROID_KEYSTORE_PASSWORD"]),
              "keyAlias=" + esc(alias),
              "keyPassword=" + esc(key_pass),
          ]
          Path("app/android/keystore.properties").write_text("\n".join(lines) + "\n")
          PY

      - name: Fallback debug keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkey -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - run: pnpm install --frozen-lockfile

      - name: Build APK
        run: |
          if [[ "${{ steps.version.outputs.BUILD_TYPE }}" == "debug" ]]; then
            pnpm run build:android:debug
          else
            pnpm run build:android
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pixuli-android-${{ steps.version.outputs.BUILD_TYPE }}-v${{ steps.version.outputs.VERSION }}
          path: |
            app/android/app/build/outputs/apk/release/app-release.apk
            app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release
        if: ${{ steps.version.outputs.IS_PUBLISH == 'true' && steps.version.outputs.BUILD_TYPE == 'release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          VER="${{ steps.version.outputs.VERSION }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists"
          else
            gh release create "$TAG" \
              --title "Pixuli Android v${VER}" \
              --notes "## Pixuli Android v${VER}

          Capacitor APK from \`${GITHUB_SHA}\`. See CHANGELOG and docs/02-system-design/05-release-versioning.md."
          fi
          gh release upload "$TAG" \
            app/android/app/build/outputs/apk/release/app-release.apk \
            --clobber
