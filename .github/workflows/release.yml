name: Release

# 手动选择 Web / Desktop / Android 构建。发布时只创建一份 GitHub Release，附上本次构建的三端产物。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer without prefix (e.g. 2.0.0). Empty = app/package.json'
        required: false
        default: ''
      target:
        description: 'Which app to release'
        required: true
        type: choice
        options:
          - web
          - desktop
          - android
          - all
        default: all
      platform:
        description: 'Desktop targets (used when target is desktop or all)'
        required: true
        type: choice
        options:
          - win
          - mac-x64
          - mac-arm64
          - all
        default: all
      build-type:
        description: 'Android build type (used when target is android or all)'
        required: true
        type: choice
        options:
          - release
          - debug
        default: release
      is-publish:
        description: 'Create one GitHub Release and upload every built asset (Android debug APKs are omitted)'
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
      tag: ${{ steps.set.outputs.tag }}
      ref: ${{ steps.set.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse
        id: set
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./app/package.json').version")
          VERSION="${{ inputs.version }}"
          if [[ -z "$VERSION" ]]; then VERSION="$PKG_VERSION"; fi
          {
            echo "version=$VERSION"
            echo "tag=v${VERSION}"
            echo "ref=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

  web:
    name: Web static site
    needs: detect
    if: inputs.target == 'web' || inputs.target == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Bump app version
        run: |
          cd app
          TARGET="${{ needs.detect.outputs.version }}"
          CURRENT=$(node -p "require('./package.json').version")
          if [[ "$CURRENT" != "$TARGET" ]]; then
            pnpm version "$TARGET" --no-git-tag-version
          fi

      - run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build:web

      - name: Pack static site
        run: |
          set -euo pipefail
          ARCHIVE="pixuli-web-v${{ needs.detect.outputs.version }}.zip"
          (cd app/dist && zip -r "$GITHUB_WORKSPACE/$ARCHIVE" .)
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: pixuli-web-v${{ needs.detect.outputs.version }}
          path: pixuli-web-v${{ needs.detect.outputs.version }}.zip
          retention-days: 30

  desktop:
    name: Desktop
    needs: detect
    if: inputs.target == 'desktop' || inputs.target == 'all'
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.detect.outputs.version }}
      platform: ${{ inputs.platform }}
      is-publish: false
    secrets: inherit

  android:
    name: Android
    needs: detect
    if: inputs.target == 'android' || inputs.target == 'all'
    uses: ./.github/workflows/release-android.yml
    with:
      version: ${{ needs.detect.outputs.version }}
      build-type: ${{ inputs.build-type }}
      is-publish: false
    secrets: inherit

  publish:
    name: GitHub Release
    needs: [detect, web, desktop, android]
    if: |
      always() &&
      inputs.is-publish &&
      needs.detect.result == 'success' &&
      (needs.web.result == 'success' || needs.web.result == 'skipped') &&
      (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (
        needs.web.result == 'success' ||
        needs.desktop.result == 'success' ||
        (needs.android.result == 'success' && inputs.build-type == 'release')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create one release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ANDROID_RESULT: ${{ needs.android.result }}
          BUILD_TYPE: ${{ inputs.build-type }}
        run: |
          set -euo pipefail
          TAG="${{ needs.detect.outputs.tag }}"
          VER="${{ needs.detect.outputs.version }}"
          SHA="${{ needs.detect.outputs.ref }}"
          TITLE="Pixuli v${VER}"
          CHANNEL="稳定版。可以按日常使用。"
          PRERELEASE_ARGS=()
          if [[ "$VER" == *alpha* ]]; then
            TITLE="Pixuli v${VER}（alpha 测试版）"
            CHANNEL="**alpha 测试版**。用来试用三端安装包和当前主路径，不建议当作稳定版依赖。正式版发布前，界面和同步行为还可能调整。"
            PRERELEASE_ARGS=(--prerelease)
          elif [[ "$VER" == *beta* ]]; then
            TITLE="Pixuli v${VER}（beta 测试版）"
            CHANNEL="**beta 测试版**。功能已基本可用，正式版发布前仍可能调整。"
            PRERELEASE_ARGS=(--prerelease)
          elif [[ "$VER" == *rc* ]]; then
            TITLE="Pixuli v${VER}（候选版）"
            CHANNEL="**候选版**。接近正式版，请优先反馈阻塞问题。"
            PRERELEASE_ARGS=(--prerelease)
          elif [[ "$VER" == *-* ]]; then
            TITLE="Pixuli v${VER}（预发布）"
            CHANNEL="**预发布版本**。正式版发布前仍可能调整。"
            PRERELEASE_ARGS=(--prerelease)
          fi
          NOTES="$(cat <<EOF
          ## ${TITLE}

          ${CHANNEL}

          本地工作区是数据源，没有官方服务器。令牌和文件都留在你自己的环境里。

          ### 这版附带的文件

          - **Web**：静态站点 zip，解压后即可托管（含 \`index.html\`、CSS、JS）
          - **Desktop**：Windows exe、macOS dmg
          - **Android**：已签名的 release APK

          构建提交：\`${SHA}\`

          ### 目前已经能用

          - 打开本地工作区，按文件夹浏览、搜索和预览资源
          - 上传图片，并做压缩、裁剪和格式转换
          - 配置多个 GitHub / Gitee 仓库；同一时间只同步其中一个
          - 同步方向可选：本地到远程，或远程到本地
          - 同步后复制公网链接（仓库需公开，链接能否打开取决于仓库策略）
          - 在设置中导入、导出远端仓库配置

          ### 试用前请看

          - 从 1.x 升级前先读 [CHANGELOG](https://github.com/trueLoving/Pixuli/blob/develop/CHANGELOG.md)：幻灯片、时间线、照片墙和旧的 Mobile 应用已移除
          - 用法见 [使用手册](https://github.com/trueLoving/Pixuli/blob/develop/docs/01-product/02-product-user-manual.md)
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" "${PRERELEASE_ARGS[@]}"
          else
            gh release create "$TAG" \
              --target "$SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              "${PRERELEASE_ARGS[@]}"
          fi
          shopt -s nullglob globstar
          files=(
            artifacts/pixuli-web-v${VER}/*.zip
            artifacts/pixuli-desktop-win-v${VER}/*.exe
            artifacts/pixuli-desktop-mac-x64-v${VER}/*.dmg
            artifacts/pixuli-desktop-mac-arm64-v${VER}/*.dmg
          )
          apks=(artifacts/pixuli-android-release-v${VER}/**/*.apk)
          if [[ ${#apks[@]} -gt 0 ]]; then
            cp "${apks[0]}" "pixuli-android-release-v${VER}.apk"
            files+=("pixuli-android-release-v${VER}.apk")
          elif [[ "$ANDROID_RESULT" == "success" && "$BUILD_TYPE" == "release" ]]; then
            echo "Android release succeeded but no APK was found to upload"
            find artifacts -type f || true
            exit 1
          fi
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release assets found"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Uploading $f"
            gh release upload "$TAG" "$f" --clobber
          done
