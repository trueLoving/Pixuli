name: Release Desktop

# 仅 GitHub Actions 手动触发（workflow_dispatch）

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer without prefix (e.g. 2.0.0). Empty = app/package.json'
        required: false
        default: ''
      platform:
        description: 'Build targets'
        required: true
        type: choice
        options:
          - win
          - mac-x64
          - mac-arm64
          - all
        default: all
      is-publish:
        description: 'Create/upload GitHub Release'
        required: false
        default: true
        type: boolean

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    name: Resolve version & platforms
    runs-on: ubuntu-latest
    outputs:
      do_win: ${{ steps.set.outputs.do_win }}
      do_mac_x64: ${{ steps.set.outputs.do_mac_x64 }}
      do_mac_arm64: ${{ steps.set.outputs.do_mac_arm64 }}
      version: ${{ steps.set.outputs.version }}
      tag: ${{ steps.set.outputs.tag }}
      is_publish: ${{ steps.set.outputs.is_publish }}
      ref: ${{ steps.set.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse
        id: set
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./app/package.json').version")
          VERSION="${{ github.event.inputs.version }}"
          if [[ -z "$VERSION" ]]; then VERSION="$PKG_VERSION"; fi
          TAG="v${VERSION}-desktop"
          PLATFORM="${{ github.event.inputs.platform }}"
          IS_PUBLISH="${{ github.event.inputs.is-publish }}"

          DO_WIN=false
          DO_MAC_X64=false
          DO_MAC_ARM64=false
          if [[ "$PLATFORM" == "win" || "$PLATFORM" == "all" ]]; then DO_WIN=true; fi
          if [[ "$PLATFORM" == "mac-x64" || "$PLATFORM" == "all" ]]; then DO_MAC_X64=true; fi
          if [[ "$PLATFORM" == "mac-arm64" || "$PLATFORM" == "all" ]]; then DO_MAC_ARM64=true; fi

          {
            echo "do_win=$DO_WIN"
            echo "do_mac_x64=$DO_MAC_X64"
            echo "do_mac_arm64=$DO_MAC_ARM64"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "is_publish=$IS_PUBLISH"
            echo "ref=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

          echo "Desktop release → version=$VERSION tag=$TAG platform=$PLATFORM publish=$IS_PUBLISH"

  build-win:
    name: Windows x64
    needs: detect
    if: needs.detect.outputs.do_win == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Bump app version
        shell: bash
        run: |
          cd app
          TARGET="${{ needs.detect.outputs.version }}"
          CURRENT=$(node -p "require('./package.json').version")
          if [[ "$CURRENT" != "$TARGET" ]]; then
            pnpm version "$TARGET" --no-git-tag-version
          fi

      - run: pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        working-directory: app
        run: |
          pnpm exec tsc
          pnpm exec vite build --mode desktop
          pnpm exec electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: pixuli-desktop-win-v${{ needs.detect.outputs.version }}
          path: |
            app/release/*.exe
            !app/release/*.blockmap
            !app/release/*.yml
          retention-days: 30

  build-mac-x64:
    name: macOS x64
    needs: detect
    if: needs.detect.outputs.do_mac_x64 == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Bump app version
        run: |
          cd app
          TARGET="${{ needs.detect.outputs.version }}"
          CURRENT=$(node -p "require('./package.json').version")
          if [[ "$CURRENT" != "$TARGET" ]]; then
            pnpm version "$TARGET" --no-git-tag-version
          fi

      - run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: app
        run: |
          pnpm exec tsc
          pnpm exec vite build --mode desktop
          pnpm exec electron-builder --mac --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: pixuli-desktop-mac-x64-v${{ needs.detect.outputs.version }}
          path: |
            app/release/*.dmg
            !app/release/*.blockmap
            !app/release/*.yml
          retention-days: 30

  build-mac-arm64:
    name: macOS arm64
    needs: detect
    if: needs.detect.outputs.do_mac_arm64 == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Bump app version
        run: |
          cd app
          TARGET="${{ needs.detect.outputs.version }}"
          CURRENT=$(node -p "require('./package.json').version")
          if [[ "$CURRENT" != "$TARGET" ]]; then
            pnpm version "$TARGET" --no-git-tag-version
          fi

      - run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: app
        run: |
          pnpm exec tsc
          pnpm exec vite build --mode desktop
          pnpm exec electron-builder --mac --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: pixuli-desktop-mac-arm64-v${{ needs.detect.outputs.version }}
          path: |
            app/release/*.dmg
            !app/release/*.blockmap
            !app/release/*.yml
          retention-days: 30

  publish:
    name: GitHub Release
    needs: [detect, build-win, build-mac-x64, build-mac-arm64]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.detect.outputs.is_publish == 'true' &&
      (needs.build-win.result == 'success' || needs.build-win.result == 'skipped') &&
      (needs.build-mac-x64.result == 'success' || needs.build-mac-x64.result == 'skipped') &&
      (needs.build-mac-arm64.result == 'success' || needs.build-mac-arm64.result == 'skipped') &&
      (needs.build-win.result == 'success' || needs.build-mac-x64.result == 'success' || needs.build-mac-arm64.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.detect.outputs.tag }}"
          VER="${{ needs.detect.outputs.version }}"
          SHA="${{ needs.detect.outputs.ref }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists"
          else
            gh release create "$TAG" \
              --title "Pixuli Desktop v${VER}" \
              --notes "$(cat <<EOF
          ## Pixuli Desktop v${VER}

          - **Tag:** \`${TAG}\`
          - **Commit:** \`${SHA}\`
          - See [CHANGELOG](./CHANGELOG.md) and [release versioning](./docs/02-system-design/05-release-versioning.md).
          EOF
          )"
          fi

      - name: Upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.detect.outputs.tag }}"
          VER="${{ needs.detect.outputs.version }}"
          shopt -s nullglob
          for f in artifacts/pixuli-desktop-win-v${VER}/*.exe \
                   artifacts/pixuli-desktop-mac-x64-v${VER}/*.dmg \
                   artifacts/pixuli-desktop-mac-arm64-v${VER}/*.dmg; do
            echo "Uploading $f"
            gh release upload "$TAG" "$f" --clobber
          done
